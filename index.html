<title>Orion Dashboard</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2;--surface:#fcfcfb;--line:#e6e4df;--line-2:#d5d3cc;
  --ink:#0b0b0b;--ink-2:#52514e;--ink-3:#8a887f;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --seq-1:#cde2fb;--seq-2:#9ec5f4;--seq-3:#6da7ec;--seq-4:#3987e5;--seq-5:#256abf;--seq-6:#184f95;
  --good:#008300;--warn:#eda100;--bad:#e34948;--good-bg:#e4f3e4;--warn-bg:#fbefd0;--bad-bg:#fbe1e1;
  --track:#e9e7e2;--wash:.12;--radius:14px;--pad:16px;
  --ord-1:#86b6ef;--ord-2:#5598e7;--ord-3:#2a78d6;--ord-4:#1c5cab;--ord-5:#104281;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211;--surface:#1a1a19;--line:#2b2b29;--line-2:#3a3a37;
    --ink:#ffffff;--ink-2:#c3c2b7;--ink-3:#8d8c84;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#3da53d;--s7:#9085e9;--s8:#e66767;
    --seq-1:#184f95;--seq-2:#1c5cab;--seq-3:#256abf;--seq-4:#2a78d6;--seq-5:#3987e5;--seq-6:#5598e7;
    --good:#3da53d;--warn:#c98500;--bad:#e66767;--good-bg:#173117;--warn-bg:#3a2a08;--bad-bg:#3a1a1a;
    --track:#2b2b29;--wash:.18;
    --ord-1:#9ec5f4;--ord-2:#6da7ec;--ord-3:#3987e5;--ord-4:#256abf;--ord-5:#184f95;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--line:#2b2b29;--line-2:#3a3a37;
  --ink:#ffffff;--ink-2:#c3c2b7;--ink-3:#8d8c84;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#3da53d;--s7:#9085e9;--s8:#e66767;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:6px 0 14px}
header h1{font-size:22px;margin:0;letter-spacing:-.01em}
header .sub{color:var(--ink-2);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.chip.good .dot{background:var(--good)}.chip.warn .dot{background:var(--warn)}.chip.bad .dot{background:var(--bad)}.chip.info .dot{background:var(--s1)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:860px){.grid{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);min-width:0}
.card h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tile .lab{font-size:12px;color:var(--ink-2)}
.tile .val{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .val.hero{font-size:34px}
.tile .delta{font-size:12px;color:var(--ink-2)}
.up{color:var(--good)}.down{color:var(--bad)}
.muted{color:var(--ink-3)}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--ink-3);font-size:11px}
.grid-line{stroke:var(--line);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:8px;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;opacity:0;transition:opacity .08s;z-index:10}
.tip.on{opacity:1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.list li:first-child{border-top:0}
.sym{font-weight:600;min-width:52px}
.tag{font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;white-space:nowrap}
.spark{width:84px;height:26px;flex:none}
.meter{height:8px;border-radius:4px;background:var(--track);overflow:hidden;flex:1;min-width:60px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--s1)}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}.meter.good i{background:var(--good)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th{font-weight:500;color:var(--ink-3);text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:0 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line-2);color:var(--ink-2)}
.pill.IGNITION{border-color:var(--s2);color:var(--ink)}.pill.COILED{border-color:var(--s1)}.pill.TRENDING{border-color:var(--s3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}
.plan{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.plan .chip{font-size:13px;padding:6px 12px}
.plan .chip.buy .dot{background:var(--s3)}.plan .chip.sell .dot{background:var(--s2)}
footer{margin-top:22px;color:var(--ink-3);font-size:12px;line-height:1.6}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1 1 220px;min-width:0}
h3{font-size:13px;margin:12px 0 6px;color:var(--ink-2);font-weight:600}
</style>
</head>

function showTip(x,y,html){tip.innerHTML=html;tip.style.left=x+"px";tip.style.top=y+"px";tip.classList.add("on");}
function hideTip(){tip.classList.remove("on");}

// ---- line chart: single series, percent, area wash, crosshair tooltip
function lineChart(series,opts={}){
  const W=opts.w||(opts.wide?Math.min(1080,window.innerWidth-66):Math.min(560,window.innerWidth-66)),H=opts.h||180,P={l:40,r:12,t:10,b:22};
  const box=el("div");
  if(!series||series.length<2){box.append(el("div",{class:"empty"},opts.empty||"No data yet."));return box;}
  const ys=series.map(d=>d.pct);let lo=Math.min(0,...ys),hi=Math.max(0,...ys);
  if(hi-lo<0.5){lo=Math.min(lo,-0.5);hi=Math.max(hi,0.5);}   // a flat line sits mid-chart, not on the floor
  const span=(hi-lo)||1;
  const X=i=>P.l+(W-P.l-P.r)*i/(series.length-1),Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/span);
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":opts.label||"line chart"});
  const ticks=niceTicks(lo,hi,4);
  ticks.forEach(t=>{svg.append(sv("line",{x1:P.l,x2:W-P.r,y1:Y(t),y2:Y(t),class:"grid-line"}));const tx=sv("text",{x:P.l-6,y:Y(t)+4,"text-anchor":"end"});tx.textContent=(t>0?"+":"")+t+"%";const g=sv("g",{class:"axis"});g.append(tx);svg.append(g);});
  const path=series.map((d,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(d.pct).toFixed(1)).join(" ");
  svg.append(sv("path",{d:path+` L${X(series.length-1).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z`,fill:opts.color||"var(--s1)",opacity:"var(--wash)"}));
  svg.append(sv("path",{d:path,fill:"none",stroke:opts.color||"var(--s1)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
  const last=series[series.length-1];
  svg.append(sv("circle",{cx:X(series.length-1),cy:Y(last.pct),r:4.5,fill:opts.color||"var(--s1)",stroke:"var(--surface)","stroke-width":2}));
  const t0=sv("text",{x:P.l,y:H-6,class:"axis"}),t1=sv("text",{x:W-P.r,y:H-6,"text-anchor":"end"});
  t0.textContent=series[0].t.slice(0,10);t1.textContent=last.t.slice(0,10);
  const ax=sv("g",{class:"axis"});ax.append(t0,t1);svg.append(ax);
  const cross=sv("line",{y1:P.t,y2:H-P.b,stroke:"var(--ink-3)","stroke-width":1,opacity:0});const dot=sv("circle",{r:5,fill:opts.color||"var(--s1)",stroke:"var(--surface)","stroke-width":2,opacity:0});
  svg.append(cross,dot);
  const hit=sv("rect",{x:0,y:0,width:W,height:H,fill:"transparent"});
  hit.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect();const fx=(e.clientX-r.left)/r.width*W;let i=Math.round((fx-P.l)/(W-P.l-P.r)*(series.length-1));i=Math.max(0,Math.min(series.length-1,i));const d=series[i];cross.setAttribute("x1",X(i));cross.setAttribute("x2",X(i));cross.setAttribute("opacity",1);dot.setAttribute("cx",X(i));dot.setAttribute("cy",Y(d.pct));dot.setAttribute("opacity",1);showTip(r.left+X(i)/W*r.width,r.top+Y(d.pct)/H*r.height,`${fmtT(d.t)}<br><b>${pct(d.pct)}</b>${d.cash_pct!=null?" · cash "+d.cash_pct+"%":""}`);});
  hit.addEventListener("pointerleave",()=>{cross.setAttribute("opacity",0);dot.setAttribute("opacity",0);hideTip();});
  svg.append(hit);box.append(svg);return box;
}
function niceTicks(lo,hi,n){const span=hi-lo||1;const raw=span/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;const step=(m<1.5?1:m<3.5?2:m<7.5?5:10)*p;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));return out.length?out:[0];}
// ---- sparkline
function spark(vals,color){
  const W=84,H=26;const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,class:"spark"});
  if(!vals||vals.length<2){return svg;}
  const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1;
  const X=i=>2+(W-4)*i/(vals.length-1),Y=v=>2+(H-4)*(1-(v-lo)/span);
  const d=vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const c=color||(vals[vals.length-1]>=vals[0]?"var(--s3)":"var(--s2)");
  svg.append(sv("path",{d,fill:"none",stroke:c,"stroke-width":1.6,"stroke-linejoin":"round"}));
  svg.append(sv("circle",{cx:X(vals.length-1),cy:Y(vals[vals.length-1]),r:2.6,fill:c,stroke:"var(--surface)","stroke-width":1.5}));
  return svg;
}

function hbars(rows,opts={}){

    const bar=el("i",{style:`width:${(r.v/max*100).toFixed(1)}%;background:${r.color||"var(--s1)"};border-radius:0 4px 4px 0;min-width:${r.v>0?"3px":"0"}`});
    track.append(bar);const val=el("span",{style:"font-size:13px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums"},r.text!=null?r.text:String(r.v));
    li.append(lab,track,val);li.title=r.title||"";box.append(li);});

  (P.exits||[]).forEach(x=>planBox.append(chipEl("sell",`${x.symbol} · ${x.reason.replace("_"," ")}`,"sell")));
  (P.entries||[]).forEach(x=>planBox.append(chipEl("buy",`${x.symbol}${x.rank?" · 60d "+(x.rank>0?"+":"")+Math.round(x.rank)+"%":""}`,"buy")));
  if(!(P.exits||[]).length&&!(P.entries||[]).length)planBox.append(el("span",{class:"empty"},P.date?"Nothing to do at the next open.":"No plan yet."));
  const planNote=el("p",{class:"note"},`Plan from the ${P.date||"–"} close · market filter ${P.market_ok===false?"OFF (benchmark below its 200-day average, no new buys)":P.market_ok?"on":"–"} · ${P.executed?"executed":sw.mode==="live"?"executes at the next open":"plan mode: not executed"}`);
  const held=el("ul",{class:"list"});
  (sw.positions||[]).forEach(p=>{const li=el("li");li.append(el("span",{class:"sym"},p.symbol),spark(p.spark),
    el("span",{class:cls(p.unrealized_pct),style:"min-width:62px;text-align:right"},pct(p.unrealized_pct)),
    p.kind==="sleeve"?el("span",{class:"tag",title:"idle cash parked in the benchmark while the market filter is on"},"cash sleeve")
      :el("span",{class:"tag",title:"distance above the stop"},"stop "+(p.to_stop_pct!=null?p.to_stop_pct.toFixed(1)+"% below":pct(p.stop_pct))),
    el("span",{class:"muted",style:"font-size:12px"},"since "+(p.entry_date||"")));held.append(li);});
  if(!(sw.positions||[]).length)held.append(el("li",{class:"empty"},"No swing positions held."+(sw.mode!=="live"?" The book is in plan mode.":"")));
  const rules=sw.rules||{};
  const swingCard=card("Swing book",`${(sw.positions||[]).length} of ${sw.max_positions||"–"} slots`,el("h3",{},"Next open"),planBox,planNote,el("h3",{},"Held"),held,
    el("p",{class:"note"},`Rules: buy IGNITION names at the next open when the benchmark is above its 200-day average; risk ${rules.risk_per_trade_pct||1}% to a stop ${rules.stop_atr||2} ATR below; trail ${rules.trail_atr||3} ATR below the highest close; sell if the trend breaks.`));
  grid.append(swingCard);

  // 3. regime & risk
  const probs=reg.probs||{};
  const pr=hbars(REG.map(r=>({label:(r===reg.current?"▸ ":"")+REGL[r],v:Math.round((probs[r]||0)*100),text:Math.round((probs[r]||0)*100)+"%",color:REGC[r]})),{labw:120});
  const strip=el("div",{style:"display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1px;margin-top:6px"});
  (reg.history||[]).forEach(h=>{const s=el("i",{style:`flex:1;background:${REGC[h.regime]||"var(--track)"}`,title:`${fmtT(h.t)} · ${REGL[h.regime]||h.regime}`});strip.append(s);});
  const legend=el("div",{class:"legend"});REG.forEach(r=>{const s=el("span");s.append(el("i",{style:"background:"+REGC[r]}),REGL[r]);legend.append(s);});
  const R=D.risk||{};
  const risk=el("div",{style:"margin-top:12px"},
    riskRow("Daily loss budget used",R.daily_loss_used_pct,`limit ${R.daily_loss_limit_pct}% on the day`),
    riskRow("Drawdown budget used",R.drawdown_used_pct,`hard halt at ${R.drawdown_limit_pct}% from the high`));
  const regCard=card("Regime & risk",reg.source?`${reg.source} · ${reg.archetype||""}`:"",pr,el("h3",{},"Regime over recent cycles"),strip,legend,risk,
    R.halted_reason?el("p",{class:"note"},"Last halt: "+R.halted_reason):el("span"));
  grid.append(regCard);

  // 4. radar
  const RD=D.radar||{};const counts=RD.counts||{};
  const funnel=hbars(STATES.map((s,i)=>({label:STL[s],v:counts[s]||0,color:`var(--seq-${i+1})`})),{labw:140});
  const tr=RD.transitions||{};const trList=el("div",{class:"note"});
  const trParts=[];if((tr.new_ignition||[]).length)trParts.push("<b>New ignition:</b> "+tr.new_ignition.join(", "));if((tr.new_coiled||[]).length)trParts.push("<b>New coiled:</b> "+tr.new_coiled.join(", "));
  if((tr.conversions||[]).length)trParts.push("<b>Up:</b> "+tr.conversions.slice(0,6).join("; "));if((tr.deteriorations||[]).length)trParts.push("<b>Down:</b> "+tr.deteriorations.slice(0,6).join("; "));
  trList.innerHTML=trParts.length?trParts.join("<br>"):"No state changes since the previous scan.";
  const tbl=el("table");tbl.append(el("thead",{},el("tr",{},...["Name","State","Rank","60d","20d","From high","Squeeze"].map(h=>el("th",{},h)))));
  const tb=el("tbody");
  (RD.candidates||[]).forEach(c=>{const tr_=el("tr");
    const nm=el("td");nm.append(el("span",{class:"sym"},c.symbol),el("span",{class:"muted",style:"font-size:11px;margin-left:6px"},c.role||""));
    const st=el("td");st.append(el("span",{class:"pill "+c.state},STL[c.state]||c.state));
    const rk=el("td");const m=el("div",{class:"meter",style:"width:70px;display:inline-block;vertical-align:middle;margin-right:6px"});m.append(el("i",{style:`width:${Math.max(2,c.rank||0)}%`}));rk.append(m,document.createTextNode((c.rank!=null?Math.round(c.rank):"–")+(c.rank_range>15?" ±":"")));rk.title=`consensus rank ${c.rank}; spread across views ${c.rank_range}`;
    tr_.append(nm,st,rk,el("td",{class:cls(c.ret_60d)},pct(c.ret_60d,1)),el("td",{class:cls(c.ret_20d)},pct(c.ret_20d,1)),el("td",{},pct(c.depth,1)),el("td",{title:"ATR14 / ATR50: below 0.8 = compressed"},c.atr_ratio!=null?c.atr_ratio.toFixed(2):"–"));
    const sp=el("td");sp.append(spark(c.spark));tr_.append(sp);tb.append(tr_);});
  if(!(RD.candidates||[]).length)tb.append(el("tr",{},el("td",{colspan:8,class:"empty"},"No coiled or ignited names in the last scan.")));
  tbl.append(tb);
  const radarCard=card("Momentum radar",`${RD.date||"–"} · ${RD.universe||0} names · ${RD.version||""}`,
    el("div",{class:"row"},el("div",{},el("h3",{},"Life cycle"),funnel,el("h3",{},"Since the previous scan"),trList),
      el("div",{style:"flex:2 1 420px"},el("h3",{},"Candidates, best rank first"),el("div",{class:"tscroll"},tbl))));
  radarCard.classList.add("span2");grid.append(radarCard);

  // 5. activity
  const ol=el("ul",{class:"list"});
  (D.orders||[]).forEach(o=>{const li=el("li");li.append(el("span",{class:"muted",style:"font-size:12px;min-width:92px"},fmtT(o.t)),el("span",{class:"sym"},o.symbol),chipEl(o.side,o.tag||"",o.side==="buy"?"good":"warn"),el("span",{class:"muted",style:"font-size:12px;overflow:hidden;text-overflow:ellipsis"},o.reason));ol.append(li);});
  if(!(D.orders||[]).length)ol.append(el("li",{class:"empty"},"No orders yet."));
  const rej=D.rejections_today||{};const rejTxt=Object.keys(rej).length?Object.entries(rej).map(([k,v])=>`${k} ×${v}`).join(", "):"none";
  const fn=D.desk_funnel||{};const stages=["PROBE","PRISM","SCALE","LIMIT","ARCHIVE","EINSTEIN","SURVIVED"];
  const fnRows=stages.filter(s=>fn[s]).map((s,i)=>({label:s==="SURVIVED"?"Survived":"Rejected at "+s,v:fn[s],color:s==="SURVIVED"?"var(--s3)":"var(--seq-3)"}));
  const ev=el("ul",{class:"list"});(D.events||[]).slice(0,6).forEach(e=>{const li=el("li");li.append(el("span",{class:"muted",style:"font-size:12px;min-width:92px"},fmtT(e.t)),el("span",{class:"tag"},e.kind),el("span",{class:"muted",style:"font-size:12px"},e.detail||""));ev.append(li);});
  const act=card("Activity","",el("h3",{},"Recent orders"),ol,el("p",{class:"note"},"Rejected by the risk gate today: "+rejTxt),
    el("h3",{},"Discovery desk, last ideas"),fnRows.length?hbars(fnRows,{labw:130}):el("div",{class:"empty"},"The desk has not judged an idea yet."),el("h3",{},"Events"),ev);
  grid.append(act);

  // 6. evidence
  const EV=D.evidence||{};
  const evBox=el("div");
  if(EV.swing_backtest){evBox.append(el("h3",{},`Swing rules, 5 years of daily bars: ${pct(EV.swing_backtest.total_return_pct,0)} · max drawdown ${EV.swing_backtest.max_drawdown_pct}%`),lineChart(EV.swing_backtest.series,{h:150,color:"var(--s3)",label:"swing backtest"}));}
  if(EV.intraday_backtest){evBox.append(el("h3",{},`Intraday rules, 3 months of 5-minute bars: ${pct(EV.intraday_backtest.total_return_pct,1)} · max drawdown ${EV.intraday_backtest.max_drawdown_pct}%`),lineChart(EV.intraday_backtest.series,{h:130,color:"var(--s7)",label:"intraday backtest"}));}
  if(!EV.swing_backtest&&!EV.intraday_backtest)evBox.append(el("div",{class:"empty"},"Run the backtest workflow to publish evidence here."));
  evBox.append(el("p",{class:"note"},"Backtests are on real venue history with costs, walk-forward folds and a remove-the-best-trades test. They are evidence of behaviour, not a promise of return; the research log has the caveats."));
  grid.append(card("Evidence","backtests on the state branch",evBox));

  document.getElementById("foot").innerHTML=`Orion: a long-only breakout book behind hard risk gates. Radar universe of ${RD.universe||0} names (benchmark ${RD.benchmark||"–"}). Config fingerprint <code>${D.config_fingerprint||"–"}</code>. This page shows percentages and signals only.`;
}
function tile(lab,val,valCls,delta){const t=el("div",{class:"tile"});t.append(el("div",{class:"lab"},lab),el("div",{class:"val "+(valCls||"")},val),el("div",{class:"delta"},delta||""));return t;}
function chipEl(k,v,kind){const c=el("span",{class:"chip "+(kind||"")});c.append(el("i",{class:"dot"}),document.createTextNode(k+" "),el("b",{},v));return c;}
function riskRow(lab,v,sub){const r=el("div",{style:"display:flex;align-items:center;gap:10px;padding:5px 0"});r.append(el("span",{style:"font-size:13px;color:var(--ink-2);min-width:150px"},lab),meter(v||0),el("span",{style:"font-size:13px;min-width:40px;text-align:right"},(v||0).toFixed(0)+"%"));r.title=sub;return r;}

const qs=new URLSearchParams(location.search).get("theme");if(qs==="dark"||qs==="light")document.documentElement.dataset.theme=qs;
render(inline);let cur=inline;let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>render(cur),150);});
fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.generated_at&&d.generated_at>(inline.generated_at||"")){cur=d;render(d);}}).catch(()=>{});
})();
</script>
