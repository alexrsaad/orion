<style>
:root{
  color-scheme:dark;
  --bg:#0a0d14;--bg-2:#0e1320;--surface:#10151f;--surface-2:#161d2b;--line:#232c3d;--line-2:#2f3a50;
  --ink:#e8edf7;--ink-2:#a6b0c6;--ink-3:#6e7a93;
  --glow:#38d6f5;--glow-soft:rgba(56,214,245,.16);
  --c-strat:#1a9fbf;--c-qqq:#bd8020;--c-spy:#b95cc0;--c-cash:#6e7a93;
  --good:#22a76e;--warn:#d9a441;--bad:#e5566a;--good-bg:rgba(34,167,110,.14);--warn-bg:rgba(217,164,65,.14);--bad-bg:rgba(229,86,106,.14);
  --st-1:#3a4457;--st-2:#35608a;--st-3:#2f7ca1;--st-4:#1a9fbf;--st-5:#b95cc0;--st-6:#22a76e;
  --track:#1c2433;--wash:.18;--radius:16px;--pad:18px;
  --display:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f8fc;--bg-2:#eef1f8;--surface:#ffffff;--surface-2:#f0f3f9;--line:#dde3ee;--line-2:#c9d2e3;
  --ink:#0f1522;--ink-2:#4a566d;--ink-3:#7c879c;
  --glow:#0b84a8;--glow-soft:rgba(11,132,168,.12);
  --c-strat:#0b84a8;--c-qqq:#9a6410;--c-spy:#8f3f96;--c-cash:#7c879c;
  --good:#1a7d52;--warn:#9a6410;--bad:#c93a4e;--good-bg:rgba(26,125,82,.12);--warn-bg:rgba(154,100,16,.12);--bad-bg:rgba(201,58,78,.12);
  --st-1:#8a94a8;--st-2:#3b6ea5;--st-3:#2a86ad;--st-4:#0b84a8;--st-5:#8f3f96;--st-6:#1a7d52;
  --track:#e6eaf3;--wash:.12;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 40px);
  background-image:radial-gradient(1200px 600px at 80% -10%,var(--glow-soft),transparent 60%),radial-gradient(800px 500px at -10% 20%,rgba(185,92,192,.10),transparent 60%);
  background-attachment:fixed}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto}
/* ---- top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.top .wrap{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand .mark{width:34px;height:34px;flex:none}
.brand h1{font:700 20px/1 var(--display);letter-spacing:.18em;margin:0;text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.brand .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 0 3px transparent}
.chip.good .dot{background:var(--good);box-shadow:0 0 10px var(--good)}.chip.warn .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}.chip.bad .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}.chip.info .dot{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 11px;font:500 12px var(--body);cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--glow)}
.btn:focus-visible,.tab:focus-visible,.rng button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);padding:10px 14px 11px;font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--glow);text-shadow:0 0 18px var(--glow-soft)}
main{padding-top:18px}
section[hidden]{display:none}
/* ---- cards & grid */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.grid{grid-template-columns:repeat(12,1fr)}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);min-width:0;position:relative}
.card.glow{box-shadow:0 0 0 1px var(--glow-soft),0 20px 60px -30px var(--glow-soft)}
.card h2{font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 small{font:400 12px var(--body);text-transform:none;letter-spacing:0;color:var(--ink-3)}
h3{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:16px 0 8px}
p.note{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.muted{color:var(--ink-3)}.up{color:var(--good)}.down{color:var(--bad)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:13px;padding:8px 0}
/* ---- hero tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-width:0}
.tile .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:var(--display)}
.tile .val{font:600 24px/1.1 var(--display);margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .val.hero{font-size:34px}
.tile .delta{font-size:12px;color:var(--ink-3);margin-top:4px}
.tile.hero{grid-column:span 2;background:linear-gradient(135deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 70%,var(--glow-soft)));border-color:color-mix(in srgb,var(--line-2) 60%,var(--glow))}
/* ---- charts */
svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--ink-3);font:11px var(--mono)}
.grid-line{stroke:var(--line);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:12px var(--body);padding:8px 10px;border-radius:8px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;opacity:0;transition:opacity .08s;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.tip.on{opacity:1}
.tip b{font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.sq{width:10px;height:10px;border-radius:3px}
.rng{display:flex;gap:4px;margin-left:auto}
.rng button{border:1px solid var(--line-2);background:transparent;color:var(--ink-3);border-radius:6px;padding:2px 8px;font:500 11px var(--mono);cursor:pointer}
.rng button[aria-pressed="true"]{color:var(--ink);border-color:var(--glow);background:var(--glow-soft)}
.chart-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.spark{width:96px;height:28px;flex:none}
/* ---- lists, tables, meters */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.list li:first-child{border-top:0}
.sym{font:600 14px var(--display);min-width:58px;letter-spacing:.02em}
.tag{font:500 11px var(--mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;white-space:nowrap}
.meter{height:8px;border-radius:4px;background:var(--track);overflow:hidden;flex:1;min-width:60px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--glow)}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}.meter.good i{background:var(--good)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 8px 8px 0;white-space:nowrap}
td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap;font-family:var(--mono);font-size:13px}
td.txt{font-family:var(--body)}
tr.hl td{background:var(--glow-soft)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.pill.OUT_OF_TREND i{background:var(--st-1)}.pill.STRUCTURAL_UPTREND i{background:var(--st-2)}.pill.RESETTING i{background:var(--st-3)}.pill.COILED i{background:var(--st-4)}.pill.IGNITION i{background:var(--st-5);box-shadow:0 0 8px var(--st-5)}.pill.TRENDING i{background:var(--st-6)}
.pill.IGNITION{color:var(--ink);border-color:var(--st-5)}
.verdict{font:700 12px var(--display);letter-spacing:.1em;padding:3px 10px;border-radius:999px}
.verdict.GREEN{background:var(--good-bg);color:var(--good)}.verdict.YELLOW{background:var(--warn-bg);color:var(--warn)}.verdict.RED{background:var(--bad-bg);color:var(--bad)}
/* ---- plan chips */
.plan{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.plan .chip{font-size:13px;padding:7px 12px}
.plan .chip.buy .dot{background:var(--good);box-shadow:0 0 10px var(--good)}.plan .chip.sell .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
/* ---- pipeline */
.pipe{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.pipe .step{flex:1 0 128px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);min-width:128px;position:relative}
.pipe .step .n{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.pipe .step .l{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;font-family:var(--display)}
.pipe .step .d{font-size:12px;color:var(--ink-2);margin-top:4px}
.pipe .step.hot{border-color:var(--st-5);box-shadow:0 0 0 1px rgba(185,92,192,.25),0 10px 30px -20px var(--st-5)}
/* ---- position cards */
.poscards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.poscards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1080px){.poscards{grid-template-columns:repeat(3,1fr)}}
.pos{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2)}
.pos .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pos .head .sym{font-size:20px;min-width:0}
.pos .big{font:700 30px/1 var(--display);margin:10px 0 2px;font-variant-numeric:tabular-nums}
.pos .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin-top:10px}
.pos .facts div{font-size:12px;color:var(--ink-3)}
.pos .facts div b{display:block;color:var(--ink);font:500 14px var(--mono)}
.ladder{position:relative;height:34px;margin:14px 0 4px}
.ladder .bar{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--bad),var(--track) 40%,var(--good))}
.ladder .mk{position:absolute;top:8px;width:2px;height:18px;background:var(--ink-3);transform:translateX(-1px)}
.ladder .mk.now{width:12px;height:12px;border-radius:50%;top:11px;background:var(--glow);box-shadow:0 0 12px var(--glow);transform:translateX(-6px)}
.ladder .mk.stop{background:var(--bad)}.ladder .mk.trail{background:var(--warn)}.ladder .mk.entry{background:var(--ink-2)}
.ladder .lb{position:absolute;top:28px;font:10px var(--mono);color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.why{font-size:12px;color:var(--ink-2);margin-top:10px;line-height:1.45}
/* ---- bars */
.hbar{display:flex;align-items:center;gap:10px;padding:5px 0}
.hbar .l{font-size:13px;color:var(--ink-2);min-width:130px}
.hbar .t{flex:1;height:12px;background:transparent;border-radius:0 4px 4px 0;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:0 4px 4px 0}
.hbar .v{font:500 13px var(--mono);min-width:44px;text-align:right}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.ast{list-style:none;padding:0;margin:0}
.ast li{padding:8px 0 8px 22px;border-top:1px solid var(--line);position:relative;font-size:13px;color:var(--ink-2)}
.ast li::before{content:"*";position:absolute;left:4px;top:6px;color:var(--st-5);font:700 16px var(--display)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-family:var(--mono)}
footer{margin-top:26px;color:var(--ink-3);font-size:12px;line-height:1.6;font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function spark(vals,color,w=96,h=28){
  const svg=sv("svg",{viewBox:`0 0 ${w} ${h}`,class:"spark"});
  if(!vals||vals.length<2)return svg;
  const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1;
  const X=i=>2+(w-4)*i/(vals.length-1),Y=v=>2+(h-4)*(1-(v-lo)/span);
  const d=vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const c=color||(vals[vals.length-1]>=vals[0]?"var(--good)":"var(--bad)");
  svg.append(sv("path",{d,fill:"none",stroke:c,"stroke-width":1.6,"stroke-linejoin":"round"}));
  svg.append(sv("circle",{cx:X(vals.length-1),cy:Y(vals[vals.length-1]),r:2.6,fill:c,stroke:"var(--surface)","stroke-width":1.5}));
  return svg;
}
